[package]
name = "margin"
version = "0.4.0"
description = "A local-first Markdown notes app called Margin"
edition = "2021"

[lib]
name = "margin_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "margin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2"
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-process = "2.3.1"
serde_json = "1.0.151"
notify = "8"
unicode-normalization = "0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
